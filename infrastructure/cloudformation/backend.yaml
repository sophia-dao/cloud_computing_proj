
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe Suggestion App - Django EC2 backend infrastructure

Resources:

  # ============================================================
  # Backend Security Group
  # ============================================================

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Recipe App Django backend
      VpcId: !ImportValue RecipeApp-VpcId

      # Allow HTTP only from CloudFront origin-facing addresses.
      # Nginx additionally validates the private origin header.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: pl-3b927c52
          Description: Allow HTTP from CloudFront origin-facing IPs

      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow outbound connectivity

      Tags:
        - Key: Name
          Value: recipe-app-backend-sg

  # ============================================================
  # EC2 IAM Role
  # ============================================================

  BackendInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM role for Recipe App EC2 backend

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

      Policies:
        - PolicyName: BackendECRPull
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"

              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !ImportValue RecipeApp-BackendRepositoryArn

        - PolicyName: RecipeAppRDSSecretRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: RecipeApp-DatabaseSecretArn
        
        - PolicyName: RecipeAppMediaS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowMediaObjectAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "${BucketArn}/media/*"
                    - BucketArn:
                        Fn::ImportValue: recipe-app-media-BucketArn

              - Sid: AllowMediaBucketListing
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::ImportValue: recipe-app-media-BucketArn
                Condition:
                  StringLike:
                    s3:prefix:
                      - "media/*"

      Tags:
        - Key: Project
          Value: RecipeSuggestionApp

  # ============================================================
  # EC2 Instance Profile
  # ============================================================

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BackendInstanceRole

# ==============================================================
# Outputs
# ==============================================================

Outputs:
  SecurityGroupId:
    Description: Backend security group ID
    Value: !Ref BackendSecurityGroup

  InstanceRoleArn:
    Description: IAM role ARN for backend EC2 instances
    Value: !GetAtt BackendInstanceRole.Arn