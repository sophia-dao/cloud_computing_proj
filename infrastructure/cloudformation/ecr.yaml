
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe Suggestion App - Backend Docker image registry
Metadata:
  com.aws.cloudformation.Context:
    arch: Private Amazon ECR repository storing the Docker image used by backend EC2 instances.

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores the Django backend Docker image for private EC2 instances to pull during startup.
    Properties:
      RepositoryName: recipe-app-backend
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: false
      Tags:
        - Key: Project
          Value: RecipeSuggestionApp

Outputs:
  RepositoryUri:
    Description: URI used to push and pull backend Docker images
    Value: !GetAtt BackendRepository.RepositoryUri
    Export:
      Name: RecipeApp-BackendRepositoryUri

  RepositoryArn:
    Description: Backend ECR repository ARN
    Value: !GetAtt BackendRepository.Arn
    Export:
      Name: RecipeApp-BackendRepositoryArn