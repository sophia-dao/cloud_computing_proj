
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe Suggestion App - Amazon RDS PostgreSQL
Metadata:
  com.aws.cloudformation.Context:
    arch: Private PostgreSQL database with encrypted storage and credentials managed by AWS Secrets Manager.

Parameters:

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class

  DBName:
    Type: String
    Default: recipe_app

  DBUsername:
    Type: String
    Default: recipe_admin

Resources:

  # ============================================================
  # RDS Security Group
  # ============================================================

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Restricts PostgreSQL connections to backend EC2 instances.
        must:
          - Allow PostgreSQL port 5432 from the backend security group.
    Properties:
      GroupDescription: Allow PostgreSQL access from Django backend
      VpcId:
        Fn::ImportValue: RecipeApp-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !ImportValue RecipeApp-BackendSecurityGroupId
      Tags:
        - Key: Name
          Value: recipe-app-rds-sg

  # ============================================================
  # Database Subnet Group
  # ============================================================

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Places the RDS instance within private database subnets across two Availability Zones.
        must:
          - Include private database subnets in two Availability Zones.
    Properties:
      DBSubnetGroupDescription: Private subnets for Recipe App RDS
      SubnetIds:
        - Fn::ImportValue: RecipeApp-PrivateDatabaseSubnetAId
        - Fn::ImportValue: RecipeApp-PrivateDatabaseSubnetBId
      Tags:
        - Key: Name
          Value: recipe-app-db-subnet-group

  # ============================================================
  # PostgreSQL Instance
  # ============================================================

  PostgreSQLDatabase:
    Type: AWS::RDS::DBInstance
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores recipe application data in a private PostgreSQL database with AWS-managed credentials.
        must:
          - Remain inaccessible from the public internet.
          - Use the database subnet group.
          - Manage the master password through Secrets Manager.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-postgres"
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: 20
      StorageType: gp3

      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      ManageMasterUserPassword: true

      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup

      PubliclyAccessible: false
      MultiAZ: false
      StorageEncrypted: true

      BackupRetentionPeriod: 1
      DeletionProtection: false
      AutoMinorVersionUpgrade: true

      Tags:
        - Key: Name
          Value: recipe-app-postgres

Outputs:

  DatabaseEndpoint:
    Description: PostgreSQL endpoint hostname
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Address
    Export:
      Name: RecipeApp-DatabaseEndpoint

  DatabasePort:
    Description: PostgreSQL port
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Port
    Export:
      Name: RecipeApp-DatabasePort

  DatabaseSecretArn:
    Description: Secrets Manager ARN for RDS master credentials
    Value: !GetAtt PostgreSQLDatabase.MasterUserSecret.SecretArn
    Export:
      Name: RecipeApp-DatabaseSecretArn

  DatabaseSecurityGroupId:
    Description: RDS security group ID
    Value: !Ref DatabaseSecurityGroup
    Export:
      Name: RecipeApp-DatabaseSecurityGroupId

  DatabaseName:
    Description: PostgreSQL database name
    Value: !Ref DBName
    Export:
      Name: RecipeApp-DatabaseName