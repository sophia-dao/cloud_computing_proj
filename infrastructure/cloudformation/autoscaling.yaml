AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe App - Private Backend Auto Scaling
Metadata:
  com.aws.cloudformation.Context:
    arch: Private EC2 Auto Scaling Group running the Django backend across two Availability Zones behind an internal ALB.

Parameters:
  BackendAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI

  BackendInstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for backend application servers

  InitialDeployment:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Launch one backend instance during initial database setup

Resources:
  BackendLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      com.aws.cloudformation.Context:
        why: Defines the EC2 configuration used to launch private Django backend instances.
        must:
          - Launch instances without public IP addresses.
          - Attach the backend IAM instance profile.
          - Require IMDSv2.
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-private-backend"
      LaunchTemplateData:
        ImageId: !Ref BackendAMI
        InstanceType: !Ref BackendInstanceType

        IamInstanceProfile:
          Name: !ImportValue RecipeApp-BackendInstanceProfileName

        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2

        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: false
            Groups:
              - !ImportValue RecipeApp-BackendSecurityGroupId
            DeleteOnTermination: true

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: recipe-app-private-asg-backend

  BackendAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Maintains two private Django backend instances across two Availability Zones and registers them with the internal ALB target group.
        must:
          - Use both private application subnets.
          - Register instances with BackendTargetGroup.
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-backend-asg"

      VPCZoneIdentifier:
        - !ImportValue RecipeApp-PrivateApplicationSubnetAId
        - !ImportValue RecipeApp-PrivateApplicationSubnetBId

      LaunchTemplate:
        LaunchTemplateId: !Ref BackendLaunchTemplate
        Version: !GetAtt BackendLaunchTemplate.LatestVersionNumber

      MinSize: !If [IsInitialDeployment, "1", "2"]
      MaxSize: "3"
      DesiredCapacity: !If [IsInitialDeployment, "1", "2"]

      TargetGroupARNs:
        - !ImportValue RecipeApp-BackendTargetGroupArn

      HealthCheckType: ELB
      HealthCheckGracePeriod: !If [IsInitialDeployment, 1800, 300]

      Tags:
        - Key: Name
          Value: recipe-app-private-asg-backend
          PropagateAtLaunch: true
Conditions:
  IsInitialDeployment: !Equals [!Ref InitialDeployment, "true"]

Outputs:
  AutoScalingGroupName:
    Value: !Ref BackendAutoScalingGroup

  LaunchTemplateId:
    Value: !Ref BackendLaunchTemplate