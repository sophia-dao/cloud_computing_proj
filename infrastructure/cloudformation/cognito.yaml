
AWSTemplateFormatVersion: "2010-09-09"
Description: Cognito authentication for Recipe Suggestion App
Metadata:
  com.aws.cloudformation.Context:
    arch: Cognito authentication with a public React SPA client, OAuth authorization code flow, and optional Google federation.

Parameters:
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique Cognito domain prefix
    AllowedPattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"

  EnableGoogleSignIn:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable Google Sign-In when OAuth credentials are configured

  GoogleOAuthSecretArn:
    Type: String
    Default: ""
    Description: ARN of an existing Secrets Manager secret containing client_id and client_secret

Conditions:
  UseGoogleSignIn: !Equals [!Ref EnableGoogleSignIn, "true"]
Rules:
  GoogleCredentialsRequired:
    RuleCondition: !Equals [!Ref EnableGoogleSignIn, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref GoogleOAuthSecretArn, ""]]
        AssertDescription: GoogleOAuthSecretArn must be provided when Google Sign-In is enabled.

Resources:

  # ----------------------------------------
  # Cognito User Pool
  # ----------------------------------------
  RecipeUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Manages registered users and authentication.
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

      UserPoolAddOns:
        AdvancedSecurityMode: "OFF"

  # ----------------------------------------
  # Google Identity Provider
  # ----------------------------------------
  RecipeGoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Metadata:
      com.aws.cloudformation.Context:
        why: Enables optional Google federated authentication.
    Condition: UseGoogleSignIn
    Properties:
      UserPoolId: !Ref RecipeUserPool
      ProviderName: Google
      ProviderType: Google

      ProviderDetails:
        client_id: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:client_id}}"
          - SecretArn: !Ref GoogleOAuthSecretArn
        client_secret: !Sub
          - "{{resolve:secretsmanager:${SecretArn}:SecretString:client_secret}}"
          - SecretArn: !Ref GoogleOAuthSecretArn
        authorize_scopes: "openid email profile"

      AttributeMapping:
        email: email
        username: sub

  # ----------------------------------------
  # React Frontend App Client
  # ----------------------------------------
  RecipeUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides OAuth authentication for the React SPA without a client secret.
    Properties:
      ClientName: !Sub "${AWS::StackName}-frontend"
      UserPoolId: !Ref RecipeUserPool

      # Public SPA client: no client secret
      GenerateSecret: false

      SupportedIdentityProviders: !If
        - UseGoogleSignIn
        - [COGNITO, Google]
        - [COGNITO]

      AllowedOAuthFlowsUserPoolClient: true

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

      CallbackURLs:
        - !Sub
          - "https://${Domain}/auth/callback"
          - Domain: !ImportValue RecipeApp-CloudFrontDomainName

      LogoutURLs:
        - !Sub
          - "https://${Domain}/"
          - Domain: !ImportValue RecipeApp-CloudFrontDomainName

      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

      PreventUserExistenceErrors: ENABLED

  # ----------------------------------------
  # Cognito Managed Login Domain
  # ----------------------------------------
  RecipeUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Metadata:
      com.aws.cloudformation.Context:
        why: Hosts the Cognito authentication endpoints.
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref RecipeUserPool

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref RecipeUserPool
    Export:
      Name: RecipeApp-CognitoUserPoolId

  UserPoolClientId:
    Description: React App Client ID
    Value: !Ref RecipeUserPoolClient
    Export:
      Name: RecipeApp-CognitoClientId

  CognitoDomain:
    Description: Cognito authentication domain
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: RecipeApp-CognitoDomain

  CognitoIssuer:
    Description: Cognito JWT issuer URL
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${RecipeUserPool}"
    Export:
      Name: RecipeApp-CognitoIssuer