
AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 storage for Recipe App media files

Parameters:
  CloudFrontDistributionId:
    Type: String
    Description: Existing CloudFront distribution ID

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${MediaBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                  - DistributionId: !Ref CloudFrontDistributionId

Outputs:
  MediaBucketName:
    Description: S3 bucket for recipe images
    Value: !Ref MediaBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  MediaBucketArn:
    Description: ARN of the media bucket
    Value: !GetAtt MediaBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketArn"
