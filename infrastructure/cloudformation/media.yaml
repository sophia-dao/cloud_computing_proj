AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 storage for Recipe App media files
Metadata:
  com.aws.cloudformation.Context:
    arch: Private S3 media storage for recipe images, with CloudFront-controlled public delivery.

Resources:
  MediaAccessLogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores server access logs generated by the private recipe media bucket.
        trust:
          src: authored
          conf: high
          note: Server access logging is intentionally disabled on this destination bucket to avoid recursive logging.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

      VersioningConfiguration:
        Status: Enabled

  MediaAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaAccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MediaAccessLogsBucket.Arn
              - !Sub "${MediaAccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

          - Sid: AllowS3ServerAccessLogging
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${MediaAccessLogsBucket.Arn}/media-access-logs/*"
            Condition:
              ArnLike:
                aws:SourceArn: !GetAtt MediaBucket.Arn
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
  
  MediaBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores recipe images privately in Amazon S3 with encryption, versioning, and public access blocked.
        must:
          - Block public bucket access.
          - Keep bucket-owner-enforced object ownership.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      VersioningConfiguration:
        Status: Enabled

      LoggingConfiguration:
        DestinationBucketName: !Ref MediaAccessLogsBucket
        LogFilePrefix: media-access-logs/

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows the designated CloudFront distribution to read recipe images without making the bucket public.
        must:
          - Restrict CloudFront access to the designated distribution ARN.
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub "${MediaBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  MediaBucketName:
    Description: S3 bucket for recipe images
    Value: !Ref MediaBucket
    Export:
      Name: RecipeApp-MediaBucketName

  MediaBucketArn:
    Description: ARN of the media bucket
    Value: !GetAtt MediaBucket.Arn
    Export:
      Name: RecipeApp-MediaBucketArn
