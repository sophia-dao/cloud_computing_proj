
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe App React frontend hosting and Django API routing

Parameters:
  BackendOriginKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Private header value shared by CloudFront and Nginx

Resources:

  # ============================================================
  # S3 Frontend Hosting
  # ============================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ============================================================
  # CloudFront Origin Access Control
  # ============================================================

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ============================================================
  # CloudFront Distribution
  # ============================================================

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html

        
        Origins:

          # React frontend
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

          # Original public EC2 backend — retained for rollback
          - Id: DjangoAPIOrigin
            DomainName: ec2-3-214-51-24.compute-1.amazonaws.com
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30
            OriginCustomHeaders:
              - HeaderName: X-Recipe-Origin-Key
                HeaderValue: !Ref BackendOriginKey

          # Private Django backend through CloudFront VPC origin
          - Id: PrivateDjangoAPIOrigin
            DomainName: internal-recipe-app-internal-alb-1524514520.us-east-1.elb.amazonaws.com
            VpcOriginConfig:
              VpcOriginId: vo_BE0O5HrJG2dFwrTMTCiYRQ
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
            ConnectionAttempts: 3
            ConnectionTimeout: 10

          # Recipe images stored in private S3
          - Id: MediaS3Origin
            DomainName: !Sub
              - "${BucketName}.s3.${AWS::Region}.amazonaws.com"
              - BucketName: !ImportValue recipe-app-media-BucketName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""


        # Default: serve React from S3
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
          FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt FrontendSpaRewriteFunction.FunctionARN

        # Route Django API requests through CloudFront VPC origin
        CacheBehaviors:
          - PathPattern: /media/*
            TargetOriginId: MediaS3Origin
            ViewerProtocolPolicy: redirect-to-https

            AllowedMethods:
              - GET
              - HEAD

            CachedMethods:
              - GET
              - HEAD

            Compress: true

            # AWS managed CachingOptimized policy
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

          - PathPattern: /api/*
            TargetOriginId: PrivateDjangoAPIOrigin
            ViewerProtocolPolicy: redirect-to-https

            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE

            CachedMethods:
              - GET
              - HEAD

            Compress: true

            # AWS managed CachingDisabled policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

            # AWS managed AllViewerExceptHostHeader policy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ============================================================
  # S3 Bucket Policy
  # ============================================================

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                  - DistributionId: !Ref FrontendDistribution
  
  # ==============================================================
  # Routing
  # ==============================================================
  
  FrontendSpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite React SPA routes to index.html
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Leave API requests unchanged.
          if (uri === '/api' || uri.indexOf('/api/') === 0) {
            return request;
          }

          // Leave static files unchanged.
          if (uri.indexOf('.') !== -1) {
            return request;
          }

          // Rewrite React routes to index.html.
          request.uri = '/index.html';
          return request;
        }
# ==============================================================
# Outputs
# ==============================================================

Outputs:

  FrontendBucketName:
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
    Export:
      Name: !Sub "${AWS::StackName}-DistributionId"

  FrontendURL:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
