
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe App React frontend hosting and Django API routing
Metadata:
  com.aws.cloudformation.Context:
    arch: CloudFront distribution serving a private React S3 frontend, Django API through a VPC origin, and private recipe images through S3.

Resources:

  # ============================================================
  # S3 Frontend Hosting
  # ============================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: Stores the React production build privately in S3.
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  # ============================================================
  # CloudFront Origin Access Control
  # ============================================================

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows CloudFront to securely access private S3 origins using signed requests.
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ============================================================
  # CloudFront Distribution
  # ============================================================
  FrontendVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    Metadata:
      com.aws.cloudformation.Context:
        why: Connects CloudFront privately to the internal application load balancer.
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub "${AWS::StackName}-backend-vpc-origin"
        Arn: !ImportValue RecipeApp-InternalAlbArn
        HTTPPort: 80
        OriginProtocolPolicy: http-only

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides the public HTTPS entry point and routes frontend, API, and media requests to their respective origins.
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html

        
        Origins:

          # React frontend
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

          # Private Django backend through CloudFront VPC origin
          - Id: PrivateDjangoAPIOrigin
            DomainName: !ImportValue RecipeApp-InternalAlbDnsName
            VpcOriginConfig:
              VpcOriginId: !GetAtt FrontendVpcOrigin.Id
              OriginReadTimeout: 30
              OriginKeepaliveTimeout: 5
            ConnectionAttempts: 3
            ConnectionTimeout: 10

          # Recipe images stored in private S3
          - Id: MediaS3Origin
            DomainName: !Sub
              - "${BucketName}.s3.${AWS::Region}.amazonaws.com"
              - BucketName: !ImportValue RecipeApp-MediaBucketName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""


        # Default: serve React from S3
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
          FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt FrontendSpaRewriteFunction.FunctionARN

        # Route Django API requests through CloudFront VPC origin
        CacheBehaviors:
          - PathPattern: /media/*
            TargetOriginId: MediaS3Origin
            ViewerProtocolPolicy: redirect-to-https

            AllowedMethods:
              - GET
              - HEAD

            CachedMethods:
              - GET
              - HEAD

            Compress: true

            # AWS managed CachingOptimized policy
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

          - PathPattern: /api/*
            TargetOriginId: PrivateDjangoAPIOrigin
            ViewerProtocolPolicy: redirect-to-https

            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE

            CachedMethods:
              - GET
              - HEAD

            Compress: true

            # AWS managed CachingDisabled policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

            # AWS managed AllViewerExceptHostHeader policy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ============================================================
  # S3 Bucket Policy
  # ============================================================

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Restricts frontend S3 object reads to the designated CloudFront distribution.
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FrontendBucket.Arn
              - !Sub "${FrontendBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                  - DistributionId: !Ref FrontendDistribution
  
  # ==============================================================
  # Routing
  # ==============================================================
  
  FrontendSpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: Rewrites React client-side routes to index.html while preserving API and media requests.
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite React SPA routes to index.html
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // Leave API and media requests unchanged.
          if (
            uri === '/api' || uri.indexOf('/api/') === 0 ||
            uri === '/media' || uri.indexOf('/media/') === 0
          ) {
            return request;
          }

          // Leave static files unchanged.
          if (uri.indexOf('.') !== -1) {
            return request;
          }

          // Rewrite React routes to index.html.
          request.uri = '/index.html';
          return request;
        }
# ==============================================================
# Outputs
# ==============================================================

Outputs:

  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution
    Export:
      Name: RecipeApp-CloudFrontDistributionId

  FrontendURL:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
    Export:
      Name: RecipeApp-FrontendURL

  CloudFrontDomainName:
    Value: !GetAtt FrontendDistribution.DomainName
    Export:
      Name: RecipeApp-CloudFrontDomainName

  FrontendBucketName:
    Value: !Ref FrontendBucket
    Export:
      Name: RecipeApp-FrontendBucketName
