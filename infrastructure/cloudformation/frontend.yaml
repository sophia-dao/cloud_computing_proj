
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe App React frontend hosting and Django API routing

Parameters:
  BackendOriginKey:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Private header value shared by CloudFront and Nginx

Resources:

  # ============================================================
  # S3 Frontend Hosting
  # ============================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ============================================================
  # CloudFront Origin Access Control
  # ============================================================

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ============================================================
  # CloudFront Distribution
  # ============================================================

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html

        Origins:

          # React frontend
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

          # Django backend on EC2
          - Id: DjangoAPIOrigin
            DomainName: ec2-3-214-51-24.compute-1.amazonaws.com
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 30

            OriginCustomHeaders:
              - HeaderName: X-Recipe-Origin-Key
                HeaderValue: !Ref BackendOriginKey

        # Default: serve React from S3
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false

        # Route Django API requests to EC2
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: DjangoAPIOrigin
            ViewerProtocolPolicy: redirect-to-https

            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE

            CachedMethods:
              - GET
              - HEAD

            Compress: true

            # AWS managed CachingDisabled policy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

            # AWS managed AllViewerExceptHostHeader policy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

        # Existing SPA fallback.
        # NOTE: These responses are distribution-wide.
        # API 403/404 errors may also return index.html.
        # Replace with SPA-specific routing before production.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # ============================================================
  # S3 Bucket Policy
  # ============================================================

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub
                  - "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${DistributionId}"
                  - DistributionId: !Ref FrontendDistribution

# ==============================================================
# Outputs
# ==============================================================

Outputs:

  FrontendBucketName:
    Value: !Ref FrontendBucket

  CloudFrontDistributionId:
    Value: !Ref FrontendDistribution

  FrontendURL:
    Value: !Sub "https://${FrontendDistribution.DomainName}"
