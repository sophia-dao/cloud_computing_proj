AWSTemplateFormatVersion: "2010-09-09"
Description: Secrets Manager configuration for Recipe App

Metadata:
  com.aws.cloudformation.Context:
    arch: Stores the Django application secret key securely for EC2 backend instances.

Resources:
  DjangoSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Generates and securely stores the Django production secret key.
    Properties:
      Description: Django production secret key
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: DJANGO_SECRET_KEY
        PasswordLength: 64
        ExcludePunctuation: true

Outputs:
  DjangoSecretArn:
    Description: ARN of the generated Django secret
    Value: !Ref DjangoSecret
    Export:
      Name: RecipeApp-DjangoSecretArn