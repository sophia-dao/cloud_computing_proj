
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe Suggestion App - VPC and public subnet infrastructure

Resources:

  # ============================================================
  # VPC
  # ============================================================

  RecipeAppVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: recipe-app-vpc
        - Key: Project
          Value: RecipeSuggestionApp

  # ============================================================
  # Internet Gateway
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: recipe-app-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref RecipeAppVPC
      InternetGatewayId: !Ref InternetGateway

  # ============================================================
  # Public Subnets
  # ============================================================

  # Public subnet for EC2 (us-east-1a)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: recipe-app-public-subnet-a

  # ============================================================
  # Public Route Table
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-public-rt

  # Default route to the Internet Gateway
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # ============================================================
  # Route Table Associations
  # ============================================================

  # Associate public subnet with public route table
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

# ==============================================================
# Outputs
# ==============================================================

Outputs:

  VpcId:
    Description: Recipe App VPC ID
    Value: !Ref RecipeAppVPC
    Export:
      Name: RecipeApp-VpcId

  PublicSubnetAId:
    Description: Public subnet ID in us-east-1a
    Value: !Ref PublicSubnetA
    Export:
      Name: RecipeApp-PublicSubnetAId

  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: RecipeApp-PublicRouteTableId
