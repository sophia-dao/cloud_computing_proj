
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe Suggestion App - VPC with public, private application, and private database subnets

Resources:

  # ============================================================
  # VPC
  # ============================================================

  RecipeAppVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: recipe-app-vpc
        - Key: Project
          Value: RecipeSuggestionApp

  # ============================================================
  # Internet Gateway
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: recipe-app-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref RecipeAppVPC
      InternetGatewayId: !Ref InternetGateway

  # ============================================================
  # Public Subnets
  # ============================================================

  # Public subnet for EC2 (us-east-1a)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: recipe-app-public-subnet-a

  # ============================================================
  # Public Route Table
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-public-rt

  # Default route to the Internet Gateway
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # ============================================================
  # Private Application Subnets (two Availability Zones)
  # ============================================================

  PrivateApplicationSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.5.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-private-app-subnet-a
        - Key: Project
          Value: RecipeSuggestionApp

  PrivateApplicationSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.6.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-private-app-subnet-b
        - Key: Project
          Value: RecipeSuggestionApp

  # Application route tables intentionally have only the implicit local VPC route.
  # Private AWS service access will be added using VPC endpoints in a later stack.
  PrivateApplicationRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-private-app-rt-a

  PrivateApplicationRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-private-app-rt-b

  PrivateApplicationSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateApplicationSubnetA
      RouteTableId: !Ref PrivateApplicationRouteTableA

  PrivateApplicationSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateApplicationSubnetB
      RouteTableId: !Ref PrivateApplicationRouteTableB

  # ============================================================
  # Private Database Subnets
  # ============================================================

  PrivateDatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-private-db-subnet-a

  PrivateDatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-private-db-subnet-b

  # ============================================================
  # Private Database Route Table
  # ============================================================

  PrivateDatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-private-db-rt

  PrivateDatabaseSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDatabaseSubnetA
      RouteTableId: !Ref PrivateDatabaseRouteTable

  PrivateDatabaseSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateDatabaseSubnetB
      RouteTableId: !Ref PrivateDatabaseRouteTable

  # ============================================================
  # Route Table Associations
  # ============================================================

  # Associate public subnet with public route table
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

# ==============================================================
# Outputs
# ==============================================================

Outputs:

  VpcId:
    Description: Recipe App VPC ID
    Value: !Ref RecipeAppVPC
    Export:
      Name: RecipeApp-VpcId

  PublicSubnetAId:
    Description: Public subnet ID in us-east-1a
    Value: !Ref PublicSubnetA
    Export:
      Name: RecipeApp-PublicSubnetAId

  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: RecipeApp-PublicRouteTableId

  PrivateDatabaseSubnetAId:
    Description: Private database subnet ID in us-east-1a
    Value: !Ref PrivateDatabaseSubnetA
    Export:
      Name: RecipeApp-PrivateDatabaseSubnetAId

  PrivateDatabaseSubnetBId:
    Description: Private database subnet ID in us-east-1b
    Value: !Ref PrivateDatabaseSubnetB
    Export:
      Name: RecipeApp-PrivateDatabaseSubnetBId

  PrivateDatabaseRouteTableId:
    Description: Private database route table ID
    Value: !Ref PrivateDatabaseRouteTable
    Export:
      Name: RecipeApp-PrivateDatabaseRouteTableId

  PrivateApplicationSubnetAId:
    Description: Private application subnet ID in us-east-1a
    Value: !Ref PrivateApplicationSubnetA
    Export:
      Name: RecipeApp-PrivateApplicationSubnetAId

  PrivateApplicationSubnetBId:
    Description: Private application subnet ID in us-east-1b
    Value: !Ref PrivateApplicationSubnetB
    Export:
      Name: RecipeApp-PrivateApplicationSubnetBId

  PrivateApplicationRouteTableAId:
    Description: Private application route table ID in us-east-1a
    Value: !Ref PrivateApplicationRouteTableA
    Export:
      Name: RecipeApp-PrivateApplicationRouteTableAId

  PrivateApplicationRouteTableBId:
    Description: Private application route table ID in us-east-1b
    Value: !Ref PrivateApplicationRouteTableB
    Export:
      Name: RecipeApp-PrivateApplicationRouteTableBId
