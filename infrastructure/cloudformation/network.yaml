
AWSTemplateFormatVersion: "2010-09-09"
Description: Recipe Suggestion App - VPC with public, private application, and private database subnets

Resources:

  # ============================================================
  # VPC
  # ============================================================

  RecipeAppVPC:
    Type: AWS::EC2::VPC
    Metadata:
      com.aws.cloudformation.Context:
        why: Provide an isolated network for the Recipe Suggestion App
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: recipe-app-vpc
        - Key: Project
          Value: RecipeSuggestionApp

  # ============================================================
  # Internet Gateway
  # ============================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Metadata:
      com.aws.cloudformation.Context:
        why: Provide internet connectivity for the public subnet
    Properties:
      Tags:
        - Key: Name
          Value: recipe-app-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Metadata:
      com.aws.cloudformation.Context:
          why: Attach the internet gateway to the application VPC
    Properties:
      VpcId: !Ref RecipeAppVPC
      InternetGatewayId: !Ref InternetGateway

  # ============================================================
  # Public Subnets
  # ============================================================

  # Public subnet for the NAT Gateway (first available AZ)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
          why: Host the NAT Gateway in a public subnet
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-public-subnet-a

  # ============================================================
  # Public Route Table
  # ============================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
          why: Route public subnet internet trffic through the internet gateway
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-public-rt

  # Default route to the Internet Gateway
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Metadata:
      com.aws.cloudformation.Context:
          why: Provide the public internet with a default iternet route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  
  # ============================================================
  # NAT Gateway - Outbound internet for private application EC2
  # ============================================================

  NatGatewayElasticIP:
    Type: AWS::EC2::EIP
    Metadata:
      com.aws.cloudformation.Context:
          why: Provide a stable public IP address for outbund NAT traffic
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: recipe-app-nat-eip

  ApplicationNatGateway:
    Type: AWS::EC2::NatGateway
    Metadata:
      com.aws.cloudformation.Context:
          why: Provide outbound internet access for private application instances
    DependsOn:
      - InternetGatewayAttachment
      - PublicDefaultRoute
    Properties:
      AllocationId: !GetAtt NatGatewayElasticIP.AllocationId
      SubnetId: !Ref PublicSubnetA
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: recipe-app-nat-gateway

  PrivateApplicationDefaultRouteA:
    Type: AWS::EC2::Route
    Metadata:
      com.aws.cloudformation.Context:
          why: Route private application subnet A outbound traffic through NAT
    Properties:
      RouteTableId: !Ref PrivateApplicationRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref ApplicationNatGateway

  PrivateApplicationDefaultRouteB:
    Type: AWS::EC2::Route
    Metadata:
      com.aws.cloudformation.Context:
          why: Route private application subnet B outbound traffic through NAT
    Properties:
      RouteTableId: !Ref PrivateApplicationRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref ApplicationNatGateway

  # ============================================================
  # Private Application Subnets (two Availability Zones)
  # ============================================================

  PrivateApplicationSubnetA:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
          why: Host private backend instances in the first availability zone
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.5.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-private-app-subnet-a
        - Key: Project
          Value: RecipeSuggestionApp

  PrivateApplicationSubnetB:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
          why: Host private backend instances in the second availability zone
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.6.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-private-app-subnet-b
        - Key: Project
          Value: RecipeSuggestionApp

  # Private application route tables use NAT for general outbound internet access.
  # VPC endpoints provide private access to supported AWS services.
  # Database subnets remain isolated without an internet default route.
  PrivateApplicationRouteTableA:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
          why: Control routing for private application subnet A
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-private-app-rt-a

  PrivateApplicationRouteTableB:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
          why: Control routing for private application subnet B
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-private-app-rt-b

  PrivateApplicationSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
          why: Associate application subnet A with its private route table
    Properties:
      SubnetId: !Ref PrivateApplicationSubnetA
      RouteTableId: !Ref PrivateApplicationRouteTableA

  PrivateApplicationSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
          why: Associate application subnet B with its private route table
    Properties:
      SubnetId: !Ref PrivateApplicationSubnetB
      RouteTableId: !Ref PrivateApplicationRouteTableB

  # ============================================================
  # Private Database Subnets
  # ============================================================

  PrivateDatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
          why: Host private database resources in the first availability zone
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-private-db-subnet-a

  PrivateDatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
          why: Host private database resources in the second availability zone
    Properties:
      VpcId: !Ref RecipeAppVPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: recipe-app-private-db-subnet-b

  # ============================================================
  # Private Database Route Table
  # ============================================================

  PrivateDatabaseRouteTable:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
          why: Keep database subnets isolated from direct internet routing
    Properties:
      VpcId: !Ref RecipeAppVPC
      Tags:
        - Key: Name
          Value: recipe-app-private-db-rt

  PrivateDatabaseSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
          why: Associate database subnet A with its isolated route table
    Properties:
      SubnetId: !Ref PrivateDatabaseSubnetA
      RouteTableId: !Ref PrivateDatabaseRouteTable

  PrivateDatabaseSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
          why: Associate database subnet B with its isolated route table
    Properties:
      SubnetId: !Ref PrivateDatabaseSubnetB
      RouteTableId: !Ref PrivateDatabaseRouteTable

  # ============================================================
  # Route Table Associations
  # ============================================================

  # Associate public subnet with public route table
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
          why: Associate database NAT Gateway subnet with its public route table
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

# ==============================================================
# Outputs
# ==============================================================

Outputs:

  VpcId:
    Description: Recipe App VPC ID
    Value: !Ref RecipeAppVPC
    Export:
      Name: RecipeApp-VpcId

  PublicSubnetAId:
    Description: Public subnet ID in us-east-1a
    Value: !Ref PublicSubnetA
    Export:
      Name: RecipeApp-PublicSubnetAId

  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: RecipeApp-PublicRouteTableId

  PrivateDatabaseSubnetAId:
    Description: Private database subnet ID in us-east-1a
    Value: !Ref PrivateDatabaseSubnetA
    Export:
      Name: RecipeApp-PrivateDatabaseSubnetAId

  PrivateDatabaseSubnetBId:
    Description: Private database subnet ID in us-east-1b
    Value: !Ref PrivateDatabaseSubnetB
    Export:
      Name: RecipeApp-PrivateDatabaseSubnetBId

  PrivateDatabaseRouteTableId:
    Description: Private database route table ID
    Value: !Ref PrivateDatabaseRouteTable
    Export:
      Name: RecipeApp-PrivateDatabaseRouteTableId

  PrivateApplicationSubnetAId:
    Description: Private application subnet ID in us-east-1a
    Value: !Ref PrivateApplicationSubnetA
    Export:
      Name: RecipeApp-PrivateApplicationSubnetAId

  PrivateApplicationSubnetBId:
    Description: Private application subnet ID in us-east-1b
    Value: !Ref PrivateApplicationSubnetB
    Export:
      Name: RecipeApp-PrivateApplicationSubnetBId

  PrivateApplicationRouteTableAId:
    Description: Private application route table ID in us-east-1a
    Value: !Ref PrivateApplicationRouteTableA
    Export:
      Name: RecipeApp-PrivateApplicationRouteTableAId

  PrivateApplicationRouteTableBId:
    Description: Private application route table ID in us-east-1b
    Value: !Ref PrivateApplicationRouteTableB
    Export:
      Name: RecipeApp-PrivateApplicationRouteTableBId
